apiVersion: v1
kind: Service
metadata:
  name: openclaw-gateway
  labels:
    app: openclaw
    component: gateway
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: metrics
    protocol: TCP
  selector:
    app: openclaw
    component: gateway
---
apiVersion: v1
kind: Service
metadata:
  name: openclaw-gateway-external
  labels:
    app: openclaw
    component: gateway
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
spec:
  type: LoadBalancer
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
  - name: https
    port: 443
    targetPort: http
    protocol: TCP
  selector:
    app: openclaw
    component: gateway
