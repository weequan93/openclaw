apiVersion: v1
kind: ConfigMap
metadata:
  name: openclaw-config
  labels:
    app: openclaw
data:
  # Database Configuration
  postgres.host: "postgres.default.svc.cluster.local"
  postgres.port: "5432"
  postgres.database: "openclaw"
  
  # Application Configuration
  node.env: "production"
  log.level: "info"
  
  # SSO Configuration
  sso.enabled: "true"
  saml.entryPoint: "https://idp.example.com/sso"
  saml.issuer: "openclaw"
  saml.callbackUrl: "https://openclaw.example.com/auth/saml/callback"
  
  oauth2.authorizationUrl: "https://auth.example.com/oauth2/authorize"
  oauth2.tokenUrl: "https://auth.example.com/oauth2/token"
  oauth2.userInfoUrl: "https://auth.example.com/oauth2/userinfo"
  oauth2.callbackUrl: "https://openclaw.example.com/auth/oauth2/callback"
  
  # Feature Flags
  features.multiTenant: "true"
  features.billing: "true"
  features.auditLog: "true"
  features.licenseCheck: "true"
  
  # Observability
  metrics.enabled: "true"
  metrics.port: "9090"
  tracing.enabled: "true"
  tracing.jaegerEndpoint: "http://jaeger-collector:14268/api/traces"
  
  # Resource Limits
  quota.maxTenantsPerLicense: "100"
  quota.maxUsersPerTenant: "1000"
  quota.maxAgentsPerTenant: "50"
