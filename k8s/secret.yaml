apiVersion: v1
kind: Secret
metadata:
  name: openclaw-secrets
  labels:
    app: openclaw
type: Opaque
stringData:
  # Database Credentials
  postgres.user: "openclaw"
  postgres.password: "CHANGE_ME_IN_PRODUCTION"
  
  # JWT Configuration
  jwt.secret: "CHANGE_ME_IN_PRODUCTION"
  jwt.issuer: "https://openclaw.example.com"
  
  # SAML Configuration
  saml.cert: |
    -----BEGIN CERTIFICATE-----
    CHANGE_ME_IN_PRODUCTION
    -----END CERTIFICATE-----
  saml.privateKey: |
    -----BEGIN PRIVATE KEY-----
    CHANGE_ME_IN_PRODUCTION
    -----END PRIVATE KEY-----
  
  # OAuth2 Configuration
  oauth2.clientId: "CHANGE_ME_IN_PRODUCTION"
  oauth2.clientSecret: "CHANGE_ME_IN_PRODUCTION"
  
  # Billing Integration
  stripe.apiKey: "CHANGE_ME_IN_PRODUCTION"
  stripe.webhookSecret: "CHANGE_ME_IN_PRODUCTION"
  paddle.apiKey: "CHANGE_ME_IN_PRODUCTION"
  paddle.webhookSecret: "CHANGE_ME_IN_PRODUCTION"
  
  # License Validation
  license.publicKey: |
    -----BEGIN PUBLIC KEY-----
    CHANGE_ME_IN_PRODUCTION
    -----END PUBLIC KEY-----
  license.privateKey: |
    -----BEGIN PRIVATE KEY-----
    CHANGE_ME_IN_PRODUCTION
    -----END PRIVATE KEY-----
